<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5a1f33">
<title>REV · Editor de videos</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><strong>REV</strong><span id="projName">Sin proyecto</span><i id="dirtyDot" class="dot" hidden title="Cambios sin descargar"></i></div>
  <div class="actions">
    <label class="btn" for="zipInput">Abrir</label>
    <input id="zipInput" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden>
    <button class="btn" id="btnSave" disabled>Guardar</button>
    <button class="btn primary" id="btnDownload" disabled>Descargar</button>
    <button class="btn" id="btnShare" hidden>Compartir</button>
    <button class="btn" id="btnExport" disabled title="Exportar MP4: aún no implementado (etapa siguiente)">MP4</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main id="app">
  <section class="stage">
    <div class="phone" id="phone">
      <canvas id="cv" width="540" height="960"></canvas>
      <canvas id="ov" width="540" height="960"></canvas>
      <div id="empty" class="empty">
        <p>Abre el ZIP de tu proyecto para empezar.</p>
        <label class="btn primary big" for="zipInput">Abrir proyecto ZIP</label>
        <button class="btn big" id="btnResume" hidden>Continuar el último proyecto</button>
      </div>
    </div>
    <div class="transport">
      <button class="btn round" id="btnPlay" aria-label="Reproducir" disabled>▶</button>
      <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" disabled>
      <span id="timeLbl" class="time">0:00.0 / 0:00.0</span>
      <label class="chk"><input type="checkbox" id="chkSafe" checked> Guías</label>
    </div>
    <div id="sceneBar" class="scenebar"></div>
  </section>

  <section class="panelwrap">
    <nav class="tabs" id="tabs">
      <button data-tab="escenas" class="on">Escenas</button>
      <button data-tab="capas">Capas</button>
      <button data-tab="ajustes">Ajustes</button>
      <button data-tab="tiempo">Tiempo</button>
      <button data-tab="audio">Audio</button>
    </nav>
    <div id="panel" class="panel"></div>
  </section>
</main>
<div id="toast" class="toast" hidden></div>
<input id="pickFile" type="file" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
